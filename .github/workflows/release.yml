name: Release

# Push a tag like v0.2.0 to build the installer and publish a GitHub release.
# Installed copies of DesktopReplay pick the update up automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Engine tests
        shell: pwsh
        run: |
          dotnet build src/DesktopReplay/DesktopReplay.csproj -c Release
          ./tools/ci-test.ps1 -Exe src/DesktopReplay/bin/Release/net10.0-windows10.0.22621.0/win-x64/DesktopReplay.exe
      - name: Build and publish release
        shell: pwsh
        run: ./tools/release.ps1 -Version "${{ github.ref_name }}".TrimStart('v') -Upload -Token "${{ secrets.GITHUB_TOKEN }}" -RepoUrl "https://github.com/${{ github.repository }}"
